name: Escenario 4 - CI/CD

# Nota: para que el job build-scan-push publique en DockerHub, el repo debe tener
# configurados los secrets DOCKERHUB_USERNAME y DOCKERHUB_TOKEN (Settings -> Secrets
# and variables -> Actions). Si no están, ese paso se salta solo y el pipeline sigue
# publicando en GitHub Container Registry (GHCR) con el GITHUB_TOKEN automático.

on:
  push:
    branches: [main, escenario-4-cicd]
    tags: ['v*']
    paths:
      - 'escenario-4-cicd/ejercicio/**'
      - '.github/workflows/escenario4-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'escenario-4-cicd/ejercicio/**'

env:
  IMAGE_NAME_GHCR: ghcr.io/${{ github.repository_owner }}/app-cicd-ejercicio

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escenario-4-cicd/ejercicio/src
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (runtime + test)
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: pytest -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local (sin publicar) para escanear
        uses: docker/build-push-action@v5
        with:
          context: escenario-4-cicd/ejercicio
          load: true
          tags: escaneo-local:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: escaneo-local:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Metadata GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_GHCR }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: escenario-4-cicd/ejercicio
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/app-cicd-ejercicio
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login a DockerHub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push a DockerHub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: escenario-4-cicd/ejercicio
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
